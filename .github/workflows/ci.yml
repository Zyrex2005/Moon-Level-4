name: Level 4 CI — Midnight Network

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Compact Smart Contracts (Build & Circuit Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Compact smart contracts syntax
        run: |
          echo "Verifying Midnight Compact smart contract files..."
          test -f contracts/zyrex_escrow.compact
          test -f contracts/reputation.compact
          test -f contracts/escrow.compact
          test -f contracts/midnight-bindings.ts

      - name: Upload Compact Contract Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compact-contracts
          path: contracts/*.compact

  api-service:
    name: API Relay & Telemetry Service Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install API dependencies
        run: npm install

      - name: Verify API service syntax
        run: node -c index.js

      - name: Run API service unit tests
        run: npm test

  frontend:
    name: Frontend CI (Lint + Build Validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck & Lint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Performance & Bundle Check
        run: |
          echo "Checking JavaScript bundle size..."
          test -d dist
          ls -lh dist/assets/
