name: Level 4 CD (Midnight Compact Contracts + Frontend Deployment)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-contracts:
    name: Deploy Compact Smart Contracts to Midnight Testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Compact Contracts to Midnight Network
        run: |
          echo "Executing Midnight deployment script..."
          bash ./scripts/deploy-midnight.sh

      - name: Upload Contract Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midnight-contract-bindings
          path: contracts/midnight-bindings.ts

  deploy-frontend:
    name: Deploy Frontend to Vercel Production
    runs-on: ubuntu-latest
    needs: [deploy-contracts]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Production Frontend
        run: npm run build
        env:
          VITE_ESCROW_CONTRACT_ID: ${{ secrets.VITE_ESCROW_CONTRACT_ID }}
          VITE_REPUTATION_CONTRACT_ID: ${{ secrets.VITE_REPUTATION_CONTRACT_ID }}

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying production bundle to Vercel..."
            npx vercel --prod --token "$VERCEL_TOKEN" --yes
          else
            echo "==> VERCEL_TOKEN secret not set. Local production build check verified successfully!"
          fi
